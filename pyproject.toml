[project]
name = "permissioned-github-mcp"
version = "0.1.0"
description = "An MCP server for GitHub issue triage where every tool is a permission"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[project.scripts]
permissioned-github-mcp = "permissioned_github_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permissioned_github_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
